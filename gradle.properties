# Done to increase the memory available for gradle.
# NeoGradle runs Vineflower decompilation in-process-adjacent worker JVMs sized from this value, and
# the 1.21.1 merged jar needs more than the old 1G/2G default.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# NeoForge Properties
# Minecraft 1.21.1 is obfuscated, so NeoGradle runs the whole NeoForm pipeline - decompile, patch,
# remap to Mojang's official names - before a single line of this module can be compiled. That is the
# one structural difference from the 26.1 target, where Minecraft ships unobfuscated and no mappings
# step exists at all.
#
# 21.1.259 is the newest release of the 1.21.1 NeoForge line, and the whole line is the last one that
# still runs on Java 21: Minecraft moved to Java 22 in 1.21.2 and NeoForge followed with the 21.4
# line, which is why the backport stops here rather than at a later 1.21.x.
#
# These five are the version of record for the mod: `build.gradle.kts` stamps the jar and
# `neoforge.mods.toml` with them, and `updates.json` is checked against them.
neoforge_minecraft_version=1.21.1
neoforge_neo_version=21.1.259
neoforge_neo_gradle_version=7.1.21
neoforge_mod_version=1211.0.1-alpha
neoforge_maven_group=dev.birb

# Kotlin for Forge 5.x is the line that targets NeoForge 21.1. Version 6.x is the 26.x line and will
# not load here.
kff_version_range=[5.10.0,5.99.999)

# Where the Rust engine's checkout is, for `copyNatives`. A relative path is resolved against this
# directory, and the default is the sibling checkout `../wgpu-mc-neo/rust`. Uncomment and edit to
# point at another clone, or pass -Pwgpu_mc_rust_dir=<path> / set WGPU_MC_RUST_DIR for one build.
#wgpu_mc_rust_dir=../wgpu-mc-neo/rust
