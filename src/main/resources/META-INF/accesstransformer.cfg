# Neolectrum access transformers - NeoForge 1.21.1 / Mojang official mappings.
#
# The 26.1 rules this file used to hold are on `main`
# (`git show main:src/main/resources/META-INF/accesstransformer.cfg`). None of them survives the
# backport as written: 26.1 is unobfuscated and uses official/Yarn-style names, while this branch
# runs against Mojang's own mappings, and half the 26.1 targets were moved or renamed by the same
# platform break that removed the `GpuBackend` seam. So the list starts empty and grows one rule at
# a time, each one added because a mixin on this branch fails to compile without it.
#
# An access transformer is applied by NeoGradle while it builds the development artifact, so a rule
# naming a member that does not exist in 1.21.1 does not warn - it fails the build. That is the
# reason for the empty list rather than a speculative conversion of the 26.1 one.
#
# What the pre-26.1 Fabric mod's access widener asked for, for whoever adds the next rule (the file
# is `fabric/src/main/resources/wgpu_mc.accesswidener` at commit b806cd3 of wgpu-mc-neo):
#
#   accessible  field  net/minecraft/client/render/chunk/ChunkBuilder$BuiltChunk  origin
#   accessible  field  com/mojang/blaze3d/platform/Window                         width, height
#   accessible  field  net/minecraft/client/model/geom/ModelPart                   children
#   accessible  field  net/minecraft/world/level/chunk/PalettedContainer           data, registry
#   accessible  field  net/minecraft/world/level/chunk/PalettedContainer$Data      palette, storage
#   accessible  method net/minecraft/client/KeyboardHandler                       onChar
#   accessible  method net/minecraft/client/MouseHandler                          onMove, onPress
#   accessible  method net/minecraft/client/renderer/LevelRenderer                updateChunks
#   mutable     field  com/mojang/blaze3d/systems/RenderSystem                    renderThread
#
# Those are Yarn names against a 1.20.4 tree, so each one still has to be re-resolved against
# Mojang's 1.21.1 names before it can be written here.
